name: Bump Homebrew tap

# Keeps kovalentai/homebrew-tap pointing at the current release.
#
# Publishing to releases.knaix.com is still a manual step that release.yml does
# not do, so this cannot simply fire on a tag: at that moment the binaries the
# formula would name usually do not exist yet. Instead every trigger runs the
# same gate, and the run ends quietly when the artifacts are not there.
#
#   release published -> lands the bump if the S3 publish already happened
#   schedule          -> catches the usual case, where it happened afterwards
#   workflow_dispatch -> lands it immediately, once you have published
#
# The tap's own scheduled CI is the backstop: it goes red if the formula is
# still behind a published release.

on:
  release:
    types: [published]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.4.5. Defaults to whatever releases.knaix.com serves.'
        required: false

permissions:
  contents: read

jobs:
  bump:
    name: Render and push the formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the formula
        id: render
        run: |
          set -uo pipefail
          mkdir -p out
          set +e
          scripts/render-tap-formula.sh "${{ github.event.inputs.version || '' }}" out/knaix.rb
          status=$?
          set -e
          case "$status" in
            0) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "ready=false" >> "$GITHUB_OUTPUT"
               echo "::notice::Release is not published to releases.knaix.com yet. Nothing to bump." ;;
            *) exit "$status" ;;
          esac

      - name: Check out the tap
        if: steps.render.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: kovalentai/homebrew-tap
          # A PAT with contents:write on the tap. The default GITHUB_TOKEN is
          # scoped to this repo and cannot push to another one.
          token: ${{ secrets.TAP_REPO_TOKEN }}
          path: tap

      - name: Commit the bump
        if: steps.render.outputs.ready == 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          cp ../out/knaix.rb Formula/knaix.rb
          if git diff --quiet; then
            echo "::notice::Formula already matches the published release."
            exit 0
          fi
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/knaix.rb)"
          git config user.name "kovalent-bot"
          git config user.email "bot@kovalentai.com"
          git add Formula/knaix.rb
          git commit -m "knaix ${version}"
          git push
          echo "::notice::Bumped the tap to ${version}."
