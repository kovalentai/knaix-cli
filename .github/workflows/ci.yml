name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks get a read-only token; state it explicitly rather
# than relying on the repository default.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version is stated in Cargo.toml, Cargo.lock and the README title,
      # and only the first two are checked by anything. The README went three
      # releases stale before it was noticed. release.yml refuses to ship a
      # mismatch, but that fires on the tag, which is after the release PR has
      # merged; catching it here tells the PR that introduced it instead.
      - name: Version stated consistently
        run: |
          set -euo pipefail
          CARGO_VER="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          EXPECTED="# Knaix CLI (v${CARGO_VER})"
          ACTUAL="$(head -1 README.md)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error file=README.md,line=1::README title is '${ACTUAL}', expected '${EXPECTED}'. Run scripts/bump-version.sh ${CARGO_VER}."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails the build on any RustSec advisory affecting the locked
      # dependency tree, including unmaintained crates.
      - name: Audit
        run: cargo audit --deny warnings
