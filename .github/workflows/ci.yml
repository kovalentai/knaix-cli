name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Not yet gating on warnings: the imported baseline has known clippy
        # lints that are cleaned up during the hardening pass. Flip this to
        # `cargo clippy --all-targets -- -D warnings` once they are resolved.
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked
