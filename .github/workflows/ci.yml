name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks get a read-only token; state it explicitly rather
# than relying on the repository default.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

  windows:
    name: Windows build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # A release publishes a Windows binary, but nothing compiled for Windows
      # until the tag was already cut. Code that only fails there -- a Unix-only
      # helper, a path assumption -- reached main and surfaced at release, which
      # is the worst place to find it. Formatting is not repeated here: it is
      # platform independent and the Linux job already gates it.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails the build on any RustSec advisory affecting the locked
      # dependency tree, including unmaintained crates.
      - name: Audit
        run: cargo audit --deny warnings
