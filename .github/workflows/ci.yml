name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks get a read-only token; state it explicitly rather
# than relying on the repository default.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test, measuring coverage
        run: cargo llvm-cov --locked --no-report

      # Floors only rise: raise them to the measured numbers, rounded down.
      - name: Coverage floors
        run: |
          cargo llvm-cov report --summary-only \
            --fail-under-lines 59 --fail-under-regions 59 --fail-under-functions 67

      # Rounded down, so the badge never claims more than was measured.
      - name: Coverage badge
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage-summary.json
          jq '.data[0].totals.lines.percent as $p | {schemaVersion: 1, label: "coverage",
              message: "\($p | floor)%",
              color: (if $p < 60 then "red" elif $p < 80 then "yellow" else "brightgreen" end)}' \
            coverage-summary.json > coverage.json
          cat coverage.json

      - name: Keep the badge for publishing
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage.json

  # Publishes the badge the README shows, from main only. Its own job, so the
  # test job's token stays read-only, and allowed to fail, since a badge that
  # did not update is no reason to mark main red.
  coverage-badge:
    name: Publish the coverage badge
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: new

      # An orphan branch that holds only the badge, committed to only when the
      # number changed.
      - name: Commit it to the badges branch
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q badges && cd badges
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin badges; then
            git checkout -q -B badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi
          cp ../new/coverage.json coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "Coverage unchanged: $(jq -r .message coverage.json)"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "coverage: $(jq -r .message coverage.json)"
          git push -q origin HEAD:badges

  # A release publishes a Windows binary, but nothing compiled for Windows until
  # the tag was already cut. Code that only fails there -- a Unix-only helper, a
  # path assumption -- reached main and surfaced at release, which is the worst
  # place to find it.
  #
  # Two jobs, because they answer different questions. This one runs the tests on
  # a real Windows machine, which is the only way to catch behaviour rather than
  # compilation; it uses the default msvc toolchain.
  windows:
    name: Windows test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # Formatting is not repeated here: it is platform independent and the
      # Linux job already gates it.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # And this one compiles the binary that actually ships, which is the gnu
  # target cross-built with zig -- the same way release.yml builds it. msvc
  # passing is not evidence that gnu links.
  # Every target a release publishes, built the way the release builds it. The
  # release workflow was the first thing to compile any of these, so a target
  # that would not link was found at tag time with the tag already pushed: a
  # Windows stack overflow, then a macOS build reaching for Apple frameworks
  # that a Linux runner has no SDK for. Same toolchain here as there, so the
  # answer is the same answer.
  release-targets:
    name: Release target compiles (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Pinned, with cargo-zigbuild below. Unpinned, every run took the newest
      # release of each, so a new Zig or cargo-zigbuild could break the macOS
      # cross-compile mid-release with no change here. These are the versions
      # that built v0.6.2; move them deliberately, in a PR of their own.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails the build on any RustSec advisory affecting the locked
      # dependency tree, including unmaintained crates.
      - name: Audit
        run: cargo audit --deny warnings

  stats:
    name: Stats payload builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The nightly download-stats job publishes an append-only history that
      # nothing else keeps a copy of, so its builder is covered here rather
      # than only by the run that would discover a fault at midnight. Standard
      # library only, so there is nothing to install.
      - name: Test
        run: python3 .github/scripts/test_build_stats.py
