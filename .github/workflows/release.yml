name: Release

# Cut a release by pushing a semver tag that matches Cargo.toml, e.g.:
#   git tag v0.3.4 && git push origin v0.3.4
# Builds static Linux (musl) and native macOS binaries for x86_64 and
# arm64, then publishes a GitHub Release with the tarballs and SHA256SUMS.
# workflow_dispatch can re-build an existing tag, or publish one that was built
# but never reached the bucket.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.3.4'
        required: true
      publish_only:
        description: 'Publish the tag''s existing release assets. Skips the build, so the signed bytes are not replaced.'
        type: boolean
        default: false

permissions:
  contents: write
  # Signing and attestation are keyless: the workflow proves who it is with a
  # short-lived OIDC token instead of a stored key, so there is no signing
  # secret to leak, rotate or expire.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  # Ship stripped release binaries without a Cargo.toml profile change.
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  # Resolve the tag once and refuse to release if it disagrees with the
  # version in Cargo.toml, so a mistagged release cannot ship.
  meta:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - id: resolve
        # The dispatch input reaches the shell through the environment. Pasted
        # into the script it runs before the check below can reject it.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          CARGO_VER="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$TAG" != "v${CARGO_VER}" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version v${CARGO_VER}."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: meta
    # A tag push has no inputs, so this is only ever false on a dispatch that
    # asked for it. Rebuilding would replace bytes that are already signed and
    # attested, and stable Rust moves, so the new ones would not even match.
    if: ${{ github.event.inputs.publish_only != 'true' }}
    # Every target, Linux musl and macOS alike, cross-compiles from one x86_64
    # Linux runner via cargo-zigbuild, which uses zig as the C/C++ linker.
    # macOS runners bill at 10x Linux, so building the Apple targets natively
    # was by far the most expensive part of a release; zig links Mach-O just
    # as well and ships the macOS libSystem stubs, so no Apple SDK is needed.
    # This also drops the musl-tools install and the native arm64 runner.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          # Windows is the gnu target rather than msvc so it cross-compiles from
          # this same Linux runner: zig supplies the C toolchain that ring needs,
          # and msvc would mean either a Windows runner at 2x the billing or
          # shipping Microsoft's CRT headers. Only x86_64 is built; arm64 Windows
          # runs x86_64 binaries under emulation, and the aarch64 gnullvm target
          # is not mature enough to hand to users.
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mlugg/setup-zig@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Windows builds knaix.exe, and the extension is not decoration: a
          # file without it will not run.
          BIN=knaix
          case "${{ matrix.target }}" in *-windows-*) BIN=knaix.exe ;; esac
          tar -czf "dist/knaix-${{ needs.meta.outputs.tag }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "$BIN"

      - uses: actions/upload-artifact@v4
        with:
          name: knaix-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [meta, build]
    if: ${{ github.event.inputs.publish_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: knaix-*
          merge-multiple: true

      # No installer is attached. The public one lives in knaix-docs and is
      # served from knaix.com/install.sh; shipping a copy here froze it at
      # release time and let the two drift apart.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum knaix-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # The bucket serves raw, platform-named binaries, and those are the bytes
      # the installer downloads and runs. They are unpacked here rather than
      # during the manual publish step so that the signature and the attestation
      # below cover exactly what a user ends up executing -- a signature over the
      # tarball would say nothing about the file extracted from it.
      - name: Unpack the platform binaries
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          map() { case "$1" in
            x86_64-apple-darwin) echo darwin-x86_64 ;;
            aarch64-apple-darwin) echo darwin-arm64 ;;
            x86_64-unknown-linux-musl) echo linux-x86_64 ;;
            aarch64-unknown-linux-musl) echo linux-arm64 ;;
            x86_64-pc-windows-gnu) echo windows-x86_64 ;;
          esac; }
          for t in x86_64-apple-darwin aarch64-apple-darwin \
                   x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                   x86_64-pc-windows-gnu; do
            plat=$(map "$t")
            ext=""; case "$t" in *-windows-*) ext=".exe" ;; esac
            tar xzf "dist/knaix-${TAG}-${t}.tar.gz" -C out
            mv "out/knaix${ext}" "out/knaix-${plat}${ext}"
            sha256sum "out/knaix-${plat}${ext}" | awk '{print $1}' \
              > "out/knaix-${plat}${ext}.sha256"
          done
          ls -l out

      - uses: sigstore/cosign-installer@v3

      # Keyless signing. The certificate records which workflow, in which
      # repository, at which tag produced these bytes, and `knaix verify` pins
      # all three -- so a signature made anywhere else does not satisfy it.
      - name: Sign the binaries
        run: |
          set -euo pipefail
          for f in out/knaix-*; do
            case "$f" in *.sha256|*.cosign.bundle) continue ;; esac
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
          done
          ls -l out

      # Named one by one rather than globbed: the directory also holds the
      # sidecars and bundles, and a pattern that tried to exclude them by suffix
      # would either attest them too or, worse, quietly attest nothing. A listed
      # path that does not exist fails the release. Note the converse is not
      # true: adding a platform to the matrix without adding it here attests the
      # other five and ships the new one unattested, so the check below counts.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/knaix-darwin-x86_64
            out/knaix-darwin-arm64
            out/knaix-linux-x86_64
            out/knaix-linux-arm64
            out/knaix-windows-x86_64.exe

      # The step above attests what it is given, so a platform added to the
      # matrix and not to that list ships unattested and nothing says so. This
      # is what says so.
      - name: Every binary is attested
        run: |
          set -euo pipefail
          ATTESTED=5
          BUILT=$(find out -type f ! -name '*.sha256' ! -name '*.cosign.bundle' | wc -l | tr -d ' ')
          if [ "$BUILT" -ne "$ATTESTED" ]; then
            echo "::error::${BUILT} platform binaries were built but ${ATTESTED} are listed for attestation. Add the new one to the Attest step's subject-path."
            exit 1
          fi
          echo "${BUILT} binaries, all attested."

      - name: Generate an SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: knaix-${{ needs.meta.outputs.tag }}-sbom.spdx.json
          output-file: dist/knaix-${{ needs.meta.outputs.tag }}-sbom.spdx.json

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* out/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

  # ---------------------------------------------------------------------------
  # Publish to releases.knaix.com
  #
  # The GitHub Release is not the install path: install.sh, install.ps1, the
  # Homebrew formula and `knaix verify` all read this bucket. While this was a
  # manual step 0.4.0 stayed installable through two later releases.
  #
  # A separate job so a failed publish re-runs alone; re-running the signing job
  # would mint a second signature and a duplicate attestation.
  #
  # Bytes come from the GitHub Release, so the bucket serves exactly what was
  # signed and attested.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to releases.knaix.com
    needs: [meta, release]
    # always(), or the skipped release job would skip this one too.
    #
    # Not "success or skipped": a build that fails on a tag push also leaves
    # release skipped, and that must not publish. Skipping is only acceptable
    # when it was asked for.
    if: >-
      ${{ always()
          && needs.meta.result == 'success'
          && (needs.release.result == 'success'
              || github.event.inputs.publish_only == 'true') }}
    runs-on: ubuntu-latest
    # One publish at a time. Two tags close together would both read the old
    # latest-version, both decide to flip, and the older could land last.
    # Queued rather than cancelled: a half-published release is the bad case.
    concurrency:
      group: publish-releases
      cancel-in-progress: false
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      RELEASES_BUCKET: knaix-releases
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-west-2

      - name: Fetch the published binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p pub
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir pub \
            --pattern 'knaix-darwin-*' \
            --pattern 'knaix-linux-*' \
            --pattern 'knaix-windows-*'
          ls -l pub

      # install.sh checks the download against this sidecar, so a mismatch here
      # is one every user hits. Recomputed, not trusted.
      - name: The checksums match the binaries
        run: |
          set -euo pipefail
          for f in pub/knaix-*; do
            case "$f" in *.sha256|*.cosign.bundle) continue ;; esac
            EXPECTED="$(cat "${f}.sha256")"
            ACTUAL="$(sha256sum "$f" | awk '{print $1}')"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::${f} hashes to ${ACTUAL} but its sidecar says ${EXPECTED}."
              exit 1
            fi
            echo "ok  $(basename "$f")  ${ACTUAL}"
          done

      # All three files per platform. install.sh treats a missing bundle as
      # fatal, so a skipped upload breaks installs rather than losing a feature.
      - name: All five platforms are complete
        run: |
          set -euo pipefail
          MISSING=0
          for p in darwin-x86_64 darwin-arm64 linux-x86_64 linux-arm64 windows-x86_64.exe; do
            for suffix in '' .sha256 .cosign.bundle; do
              if [ ! -f "pub/knaix-${p}${suffix}" ]; then
                echo "::error::pub/knaix-${p}${suffix} is missing from the release."
                MISSING=1
              fi
            done
          done
          [ "$MISSING" -eq 0 ]

      - name: Upload
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for f in pub/knaix-*; do
            # Checksums are served as text, matching every release since 0.5.0.
            # As binary/octet-stream, install.ps1 reads the body as a Byte[]
            # and reports a working checksum as a failed download.
            case "$f" in
              *.sha256) CONTENT_TYPE=text/plain ;;
              *)        CONTENT_TYPE=binary/octet-stream ;;
            esac

            aws s3api put-object \
              --bucket "$RELEASES_BUCKET" \
              --key "v${VERSION}/$(basename "$f")" \
              --body "$f" \
              --content-type "$CONTENT_TYPE" \
              --cache-control 'public, max-age=31536000, immutable' > /dev/null
            echo "put v${VERSION}/$(basename "$f")  ${CONTENT_TYPE}"
          done

      # put-object exits 0 per object; the switch below is thrown once for all
      # fifteen. So read them back.
      - name: Read the objects back
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for p in darwin-x86_64 darwin-arm64 linux-x86_64 linux-arm64 windows-x86_64.exe; do
            for suffix in '' .sha256 .cosign.bundle; do
              aws s3api head-object \
                --bucket "$RELEASES_BUCKET" \
                --key "v${VERSION}/knaix-${p}${suffix}" > /dev/null
            done
          done
          echo "All fifteen objects are being served under v${VERSION}."

      # Artifacts are cached immutable for a year, so re-publishing a version to
      # replace bad bytes would change S3 and nothing a user sees. A no-op on a
      # first publish, and the only way to repair a release on a later one.
      - name: Invalidate the release prefix
        env:
          DISTRIBUTION_ID: ${{ vars.KNAIX_RELEASES_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/v${VERSION}/*" > /dev/null

      # workflow_dispatch can name an old tag. Rebuilding v0.4.9 to replace a
      # corrupt asset is fine; moving every installer back to it is not. The
      # upload is safe to repeat, so this is the only step that has to check.
      - name: This release is not older than the one being served
        id: newer
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # To a file: get-object also prints its JSON response to stdout, so
          # reading the value there returns the two mixed together.
          if aws s3api get-object --bucket "$RELEASES_BUCKET" \
               --key latest-version served.txt >/dev/null 2>&1; then
            CURRENT="$(tr -d '[:space:]' < served.txt)"
          else
            CURRENT=''
          fi

          if [ -z "$CURRENT" ]; then
            echo "Nothing is being served yet."
            echo "flip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEWEST="$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)"
          if [ "$NEWEST" != "$VERSION" ]; then
            echo "::warning::releases.knaix.com serves ${CURRENT}, which is newer than ${VERSION}. The binaries are published and verifiable, but latest-version is left alone so installs keep resolving to ${CURRENT}."
            echo "flip=false" >> "$GITHUB_OUTPUT"
          else
            echo "flip=true" >> "$GITHUB_OUTPUT"
          fi

      # The switch. install.sh reads this to decide what to fetch, so a version
      # named here whose binaries are absent fails every install. Written after
      # all fifteen objects read back, so a half-finished publish leaves the
      # previous release serving. No trailing newline: it is a bare string.
      - name: Flip latest-version
        if: steps.newer.outputs.flip == 'true'
        env:
          DISTRIBUTION_ID: ${{ vars.KNAIX_RELEASES_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          printf '%s' "$VERSION" > latest-version

          aws s3api put-object \
            --bucket "$RELEASES_BUCKET" \
            --key latest-version \
            --body latest-version \
            --content-type text/plain \
            --cache-control 'public, max-age=60' > /dev/null

          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths /latest-version > /dev/null

          echo "releases.knaix.com now serves ${VERSION}."

      - name: Summary
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          {
            echo "## ${TAG} published"
            echo
            if [ "${{ steps.newer.outputs.flip }}" = "true" ]; then
              echo "\`releases.knaix.com\` serves **${VERSION}**. \`curl -sSL https://knaix.com/install.sh | sh\` installs it now."
            else
              echo "Binaries are published under \`v${VERSION}\`, but \`latest-version\` was left pointing at a newer release."
            fi
            echo
            echo "Homebrew follows on its own: \`kovalentai/homebrew-tap\` polls hourly and bumps once the bucket serves the new version. Nothing to push."
          } >> "$GITHUB_STEP_SUMMARY"
