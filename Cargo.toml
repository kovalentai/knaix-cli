[package]
name = "knaix"
version = "0.4.10"
edition = "2021"
description = "The command-line client for Kovalent AI: provision nodes, ingest documents, and chat over a zero-trust mesh."
authors = ["Kovalent AI"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://knaix.com"
repository = "https://github.com/kovalentai/knaix-cli"
keywords = ["kovalent", "ai", "cli", "rag", "sovereign"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1.21", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
open = "5"
axum = "0.8"
tokio-util = { version = "0.7", features = ["codec"] }
home = "0.5"
futures-util = "0.3"
url = "2.3"
getrandom = "0.2"
sha2 = "0.10"
indicatif = "0.18.4"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
rustyline = { version = "17", features = ["derive"] }
termimad = "0.35"
crossterm = "0.29"
anyhow = "1.0"
comfy-table = "7.2.2"
walkdir = "2.5.0"
base64 = "0.22.1"
globset = "0.4.19"
toml = "0.8"
clap_complete = "4.6.7"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }

# Only to hand SIGPIPE back to the kernel at startup. See restore_sigpipe.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
